<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RGA · Article Detail — Variants</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; background: #f0eee9; font-family: "Outfit", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    ::selection { background: rgba(0,255,65,0.3); color: #fff; }
    a { color: inherit; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="article.jsx"></script>
  <script type="text/babel" data-presets="react">
    const W = 1480;
    const H = 4400; // tall enough to hold the full article

    const Frame = ({ children }) => (
      <div style={{ width: W, minHeight: H, background: "#030303", color: "#fff", overflow: "hidden" }}>
        {children}
      </div>
    );

    const App = () => (
      <window.DesignCanvas>
        <window.DCSection id="article-detail" title="Article Detail" subtitle="Three directions for the long-read view — same content, same rails, different hero treatment and accent.">
          <window.DCArtboard id="stack-green" label="A · Stacked + Matrix green" width={W} height={H}>
            <Frame><window.Article heroStyle="stack" accent="green" pullQuoteStyle="bar" /></Frame>
          </window.DCArtboard>

          <window.DCArtboard id="split-cyan" label="B · Split + Ion cyan" width={W} height={H}>
            <Frame><window.Article heroStyle="split" accent="cyan" pullQuoteStyle="bar" /></Frame>
          </window.DCArtboard>

          <window.DCArtboard id="terminal-magenta" label="C · Terminal + Glitch magenta" width={W} height={H}>
            <Frame><window.Article heroStyle="terminal" accent="magenta" pullQuoteStyle="terminal" /></Frame>
          </window.DCArtboard>
        </window.DCSection>
      </window.DesignCanvas>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
