<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RGA · Footer Designs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; background: #030303; color: #fff; font-family: "Outfit", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    ::selection { background: rgba(0,255,65,0.3); color: #fff; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Hanson Bold isn't web-safe; falls back to Black Ops One in-system. Define @font-face against public path fallback. -->
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="footers.jsx"></script>
  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;

    // Mini-site context so each footer sits at the end of a real-feeling page.
    const PageContext = ({ children }) => (
      <div style={{ background: "#030303", color: "#fff", fontFamily: "Outfit, system-ui, sans-serif", minHeight: "100%" }}>
        {/* faux hero above the footer so spacing reads naturally */}
        <div
          style={{
            position: "relative",
            height: 220,
            borderBottom: "1px solid rgba(0,255,65,0.08)",
            background:
              "radial-gradient(ellipse 60% 80% at 50% 100%, rgba(0,255,65,0.10) 0%, transparent 60%), #030303",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            fontFamily: "'JetBrains Mono', monospace",
            fontSize: 11,
            letterSpacing: "0.4em",
            color: "#555",
            textTransform: "uppercase",
          }}
        >
          <span>/// PRECEDING PAGE CONTENT · END ///</span>
        </div>
        {children}
      </div>
    );

    const App = () => (
      <DesignCanvas
        title="RGA · Footer Designs"
        subtitle="Four variations on the Rogue Army 'corrupted signal' footer — pick a direction or mix & match."
      >
        <DCSection id="footers" title="Footer Variations">
          <DCArtboard id="v1" label="V1 · Terminal Session" width={1440} height={820}>
            <PageContext>
              <TerminalFooter />
            </PageContext>
          </DCArtboard>

          <DCArtboard id="v2" label="V2 · Tactical HUD" width={1440} height={1000}>
            <PageContext>
              <HudFooter />
            </PageContext>
          </DCArtboard>

          <DCArtboard id="v3" label="V3 · Gigantique Wordmark" width={1440} height={860}>
            <PageContext>
              <WordmarkFooter />
            </PageContext>
          </DCArtboard>

          <DCArtboard id="v4" label="V4 · Corrupted Broadcast" width={1440} height={980}>
            <PageContext>
              <CorruptedFooter />
            </PageContext>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
