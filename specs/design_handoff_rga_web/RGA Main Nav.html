<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RGA · Fullscreen Nav Explorations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" />

  <style>
    @font-face {
      font-family: "Hanson Bold";
      src: url("assets/Hanson-Bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    html, body { margin: 0; padding: 0; background: #f0eee9; font-family: "Outfit", system-ui, sans-serif; }
    .nav-stage { width: 100%; height: 100%; background: #030303; overflow: hidden; position: relative; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="nav-components.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "glow": 1,
      "loggedIn": false
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const props = { glow: t.glow, loggedIn: t.loggedIn };

      return (
        <React.Fragment>
          <DesignCanvas>
            <DCSection id="closed" title="RGA Fullscreen Nav · entry point"
              subtitle="The closed state — the menu lives quietly in the top-right of the homepage. Tap MENU to expand into one of the four open states below.">
              <DCArtboard id="closed-state" label="00 · Closed — sits over the homepage hero"
                width={1280} height={520}>
                <div className="nav-stage"><NavClosed {...props} /></div>
              </DCArtboard>
            </DCSection>

            <DCSection id="open-variants" title="Open state · four directions"
              subtitle="Each variant takes over the full viewport when the menu opens. Same nav data, four different ways to present it. All four have the top bar with logo + Discord CTA + close button persistent.">

              <DCArtboard id="split" label="A · Photo Split — link list right, photo grid left"
                width={1280} height={780}>
                <div className="nav-stage"><NavSplit {...props} /></div>
              </DCArtboard>

              <DCArtboard id="centered" label="B · Centered — single column, ultra quiet"
                width={1280} height={780}>
                <div className="nav-stage"><NavCentered {...props} /></div>
              </DCArtboard>

              <DCArtboard id="reactive" label="C · Reactive — three-column index, hover the left to see sublinks"
                width={1280} height={780}>
                <div className="nav-stage"><NavReactive {...props} /></div>
              </DCArtboard>

              <DCArtboard id="magazine" label="D · Magazine — featured story dominant, links as bottom rail"
                width={1280} height={780}>
                <div className="nav-stage"><NavMagazine {...props} /></div>
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel>
            <TweakSection label="Auth state" />
            <TweakToggle  label="Logged in" value={t.loggedIn}
                          onChange={(v) => setTweak('loggedIn', v)} />
            <TweakSection label="Vibe" />
            <TweakSlider  label="Glow intensity" value={t.glow}
                          min={0} max={2} step={0.05}
                          onChange={(v) => setTweak('glow', v)} />
          </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
